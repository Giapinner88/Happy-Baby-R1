seed: 42
num_steps_per_env: 24
max_iterations: 20001
obs_groups:
  actor:
  - actor
  - adapter_history
  critic:
  - critic
  - privileged
save_interval: 100
experiment_name: r1_flat_plus_arma_o83
run_name: arma_o83_finetune_seed42
logger: wandb
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    init_std: 1.0
    std_type: scalar
  phase: rma
  latent_dim: 8
  adapter_checkpoint: /home/ubuntu22/mujoco_mjlab/unitree_rl_mjlab_meta/checkpoints/r1_flat_plus_arma/o83_k50_z8/adaptation.pt
  freeze_latent_source: null
  allow_untrained_adapter: false
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  rnd_cfg: null
  symmetry_cfg: null
multi_gpu: null
