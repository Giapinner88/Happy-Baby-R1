# ============================================================================
# RUNTIME / DDS / INPUT (chọn đúng card mạng để kết nối DDS thành công)
# ============================================================================
# Card mạng DDS của R1 (thường là eth10).
network_interface: eth10
# true = chế độ headless (không mở keyboard X11) cho service chạy trên robot.
dev_no_keyboard: true

# Lọc thông thấp (Hz; 0.0 = tắt). Lưu ý: bật lọc cần kiểm tra lại phase/gait trước khi deploy.
imu_gyro_lpf_hz: 0.0
joint_vel_lpf_hz: 0.0

# Bù pitch IMU (độ). Lưu ý: trim locomotion sẽ dời mốc nghiêng của fall detector tương ứng.
imu_pitch_trim_deg: 0.0
imu_pitch_trim_affects_locomotion: false
imu_pitch_trim_affects_dance: true

# Trim riêng cho locomotion (để trống = dùng imu_pitch_trim_deg ở trên).
# Chỉ có tác dụng khi imu_pitch_trim_affects_locomotion = true.
# locomotion_trim_deg: 0.0

# Thời gian chờ watchdog cho input/state (ms). Khi kết nối lại, cần nhả phím về neutral trước.
state_timeout_ms: 1000.0
remote_timeout_ms: 3000.0
remote_recover_ms: 200.0
remote_require_neutral: true
# Thời gian chờ event của keyboard X11 trước khi xác nhận đã nhả phím (ms).
x11_release_ms: 2500.0

# ============================================================================
# SAFETY — An toàn robot (chỉ điều chỉnh khi có thiết bị hoặc người bảo vệ robot).
# ============================================================================
# Gain PD khi ở chế độ stand-up / stand-lock (không dùng policy).
stand_kp_leg: 200.0
stand_kp_waist: 200.0
stand_kp_arm: 40.0
stand_kd: 3.0

# Gain CỔ CHÂN riêng cho đường VÀO dance (locomotion -> mimic), để bớt khựng:
# dùng ở kReturningToDefault và làm điểm xuất phát ramp gain lúc soft-start mimic.
# KHÔNG áp cho stand-up / stand-lock — 2 state đó vẫn ăn stand_kp_leg ở trên.
#
# ĐỪNG hạ xuống mức policy (40). Khi không có policy chạy, robot là con lắc ngược
# quanh cổ chân: m*g*h = 28.9kg * 9.81 * 0.593m = 168 Nm/rad độ cứng ÂM. Hai cổ chân
# pitch góp 2*kp, nên kp dưới 84 là KHÔNG có điểm cân bằng -> robot đổ (kd chỉ làm
# đổ chậm lại chứ không giữ được). App từ chối khởi động nếu đặt dưới 100.
#   120 -> dự trữ 1.43x so với trọng lực, chu kỳ lắc 2.7s   (đang dùng)
#   200 -> dự trữ 2.38x, chu kỳ lắc 1.5s                    (giá trị cũ)
return_kp_ankle: 100.0

# Scale gain từ metadata ONNX. Nên giữ 1.0; thay đổi sai có thể gây mất thăng bằng.
policy_kp_scale: 1.0
policy_kd_scale: 1.0

# Phát hiện ngã: fall_flip_* bắt chuyển động gập nhanh; debounce lọc nhiễu frame ngắn.
fall_enabled: true
fall_tilt_deg: 50.0
fall_flip_tilt_deg: 30.0
fall_flip_gyro: 4.0
fall_debounce_ms: 30.0
joint_speed_guard_enabled: true
joint_speed_limit: 25.0
joint_speed_debounce_ms: 30.0

# Khi mất tín hiệu input, chế độ safe-stop tự động ép lệnh điều khiển về 0.
safe_stop_enabled: true
safe_stop_debounce_ms: 300.0
# Kiểm soát chuyển giao quyền từ điều khiển built-in sang run_r1 an toàn.
arm_gate_enabled: true
arm_require_button: true
arm_hold_s: 3.0
arm_silence_ms: 3000.0
arm_require_seen_builtin: true
arm_min_foreign_seen: 5
arm_conflict_min: 3
arm_conflict_window_ms: 150.0
arm_conflict_release: true
arm_no_builtin_timeout_s: 0

# Giám sát dung lượng pin và cảnh báo; tự động chuyển action bảo vệ khi pin cạn.
battery_monitor_enabled: true
battery_topic: "rt/lf/bmsstate"
battery_warn_pct: 20
battery_critical_pct: 5
battery_critical_action: sit
battery_announce_period_s: 60.0
battery_stale_s: 30.0

# ============================================================================
# LOCOMOTION — Giới hạn tốc độ lệnh điều khiển của người lái.
# ============================================================================
# Giới hạn tốc độ ở hai mức Chậm / Nhanh (tiến, ngang, xoay yaw, lùi).
slow_vx: 1.0
slow_vy: 0.5
slow_yaw: 1.5
slow_vx_back: 0.5
fast_vx: 1.5
fast_vy: 0.8
fast_yaw: 1.7
fast_vx_back: 0.8

# Gia tốc tăng/giảm (decel nhỏ hơn accel để hãm buông phím mượt mà).
cmd_accel_vx: 2.5
cmd_accel_vy: 2.0
cmd_accel_yaw: 3.0
cmd_decel_vx: 1.2
cmd_decel_vy: 1.2
cmd_decel_yaw: 1.5

# Heading-hold: Tự động khóa và giữ hướng thẳng bằng vòng lặp kín yaw.
heading_hold_enabled: true
heading_hold_kp: 0.9
heading_hold_max_yaw: 0.5
heading_hold_move_min: 0.15
heading_hold_relatch_gyro: 0.3

# ============================================================================
# CHỌN POLICY ĐI BỘ (flat_policy_contract và flat_model phải khớp nhau)
# Đổi xong cần chạy ./deploy.sh và restart service run_r1.
# - legacy_83: 83-D (policy thuần, gesture overlay motor tay).
# - r1_unified_v10: 105-D (gesture đi vào dưới dạng reference, điều khiển cân bằng).
# ============================================================================
# ĐANG DÙNG — sửa 2 dòng này
# ---------------------------------------------------------------------------
flat_policy_contract: legacy_83
flat_model: policy_goc.onnx

# --- ROLLBACK về policy đi bộ cũ (bỏ comment 2 dòng bên dưới nếu dùng) ---
# flat_policy_contract: legacy_83
# flat_model: policy_8.onnx

# Lưu ý: Hệ thống đối chiếu policy thông qua MODEL_REL và MODEL_SHA256 trong model_manifest.conf.

# Cấu hình tín hiệu tay cho Unified (V10/V11). Không áp dụng cho legacy_83.
unified_stationary_cmd_threshold: 0.02
unified_stationary_hold_s: 0.30
# true = truyền thẳng tín hiệu quỹ đạo .npz; false = áp dụng bộ lọc giới hạn vel/acc bên dưới.
unified_arm_ref_passthrough: true
unified_arm_ref_max_vel_rad_s: 3.0
unified_arm_ref_max_acc_rad_s2: 10.0

# Cấu hình chuyển state và rate limit (không hạ policy_rate_limit quá thấp để tránh trễ phase).
stand_up_time_s: 2.5
blend_time_s: 0.5
stand_rate_limit: 5.0
lock_rate_limit: 0.2
return_rate_limit: 1.5
# 0.0 = không dạng chân khi stand-lock (giữ đúng default_joint_pos của policy).
stand_lock_spread: 0.0
return_pos_tol: 0.12
settle_time_s: 1.0
settle_gyro_max: 0.5
# Thời gian cảnh báo trước khi vào stand-lock.
stand_lock_warn_s: 1.5
# Thời gian khóa lệnh sau chuyển trạng thái để chống nhấp nút nhầm/dội phím.
dance_abort_lock_block_s: 2.0
stand_lock_sit_block_s: 1.0
policy_rate_limit: 30.0

# ============================================================================
# POSTURES — Cấu hình tư thế (Ngồi ghế L2+Trái, Đứng lên/Nằm xuống L2+X).
# Chế độ DESC (hạ trọng tâm, tự thăng bằng) và REST (ngồi vững khi có ghế đỡ).
# ============================================================================
# [DESC] Thông số gập hông/gối lúc bắt đầu hạ.
sit_hip_deg: 130.0
sit_knee_deg: 82.0
sit_spread: 0.08
# [REST] Thông số tư thế cuối sau khi ngồi vững trên ghế.
sit_rest_hip_deg: 87.0
sit_rest_knee_deg: 82.0
sit_rest_spread: 0.45
sit_rest_hip_yaw: 0.45
# Góc nghiêng thân trên ra trước khi hạ để đảm bảo thăng bằng.
sit_lean_deg: 58.0
sit_seated_lean_deg: 20.0
sit_arm_forward: -1.5
sit_arm_elbow: 0.3
# Vị trí tay khi ngồi (đặt tựa trên đùi).
sit_seated_arm_pitch: 0.0
sit_seated_arm_elbow: 0.42
# Hệ số bù góc cổ chân theo IMU để bám sát mặt đất (0 = tắt, 1 = tối đa).
sit_ankle_gravity_gain: 0.4
sit_descent_time_s: 4.0
# Thời gian ổn định sau khi ngồi và cấu hình nhả mô-men PD.
sit_settle_time_s: 1.5
sit_hold_s: 0.5
sit_release_after: false
sit_kp_leg: 200.0
sit_kd: 3.0
sit_rate_limit: 3.0
sit_gather_time_s: 1.5

# Cấu hình phát lại quỹ đạo (.npz) cho hành động Đứng lên / Nằm xuống (L2+X).
getup_motion_file: motions/getup.npz
liedown_motion_file: motions/liedown.npz
getup_kp_leg: 220.0
getup_kp_waist: 200.0
getup_kp_arm: 60.0
getup_kd: 4.0
getup_rate_limit: 6.0
liedown_rate_limit: 4.0
# Thời gian blend chuyển tiếp mượt frame đầu và tốc độ phát (speed = 1.0 là tiêu chuẩn).
getup_blend_time_s: 0.6
liedown_blend_time_s: 0.6
getup_speed: 1.0
liedown_speed: 1.0
getup_liedown_block_s: 1.0
# Bù góc cổ chân nếu dữ liệu .npz có thông tin hướng thân (torso_quat).
getup_ankle_gravity_gain: 0.5
# Ngưỡng góc nghiêng IMU (độ) để xác định robot đang ở tư thế nằm.
lying_tilt_deg: 60.0
hold_to_trigger_s: 3.0

# ============================================================================
# DANCE / MIMIC (R1 + Up/Right/Down/Left/A = slot 2..6).
# Cấu hình folder policy, tốc độ phát, âm lượng và góc trim pitch IMU cho từng slot.
# ============================================================================
dance_2: lacmong3im
dance_speed_2: 1.0
dance_volume_2: 1.0
dance_trim_deg_2: 0.0
#dance_3: doremon_v7
#dance_speed_3: 1.0
#dance_volume_3: 1.0
#dance_trim_deg_3: 0.0
dance_4: pokemonim
dance_speed_4: 1.0
dance_volume_4: 1.0
dance_trim_deg_4: -0.1
dance_5: doremonim
dance_speed_5: 1.0
dance_volume_5: 1.0
dance_trim_deg_5: -1.72
dance_6: nhaydongian2
dance_speed_6: 1.0
dance_volume_6: 1.0
dance_trim_deg_6: 0.0

# start_frame=-1: tự tìm frame mở đầu mượt. Handover diễn ra khi robot đủ tĩnh hoặc hết max_s.
dance_start_frame: -1
dance_start_search_frames: 200
mimic_announce_delay_s: 2.0
mimic_announce_min_s: 0.3
mimic_announce_timeout_s: 20.0
mimic_warmup_s: 1.5
mimic_cooldown_s: 1.8
mimic_handover_tilt: 0.15
mimic_handover_gyro: 0.5
mimic_handover_min_s: 0.3
mimic_handover_max_s: 3.0
# Telemetry ghi log riêng ở 100 Hz; giữ log post_s sau handover để phân tích chuyển động.
mimic_telemetry_enabled: true
mimic_telemetry_hz: 100
mimic_telemetry_post_s: 5.0
mimic_telemetry_dir: logs/telemetry

# ============================================================================
# GESTURE — Cử chỉ (Double-click: 1=Up 2=Down 3=Left 4=Right 5=A 6=B 7=X 8=Y).
# Với legacy_83: ghi đè trực tiếp motor tay; với V10: gửi qua tín hiệu reference.
# ============================================================================
gesture_enabled: true
gesture_folder: policies/gestures

# Slot 1 (Up): vẫy tay.
gesture_slot_1: vaytay_2
# Slot 2 (Down): bắt tay (tốc độ chậm và thời gian thu tay dài để mượt).
gesture_slot_2: battay
gesture_slot_speed_2: 0.6
gesture_slot_retract_2: 3.5
# Slot 3 (Left): ăn mừng; Slot 4 (Right): đưa quà.
gesture_slot_3: namtay_anmung
gesture_slot_speed_3: 0.7
gesture_slot_retract_3: 2.5

gesture_slot_4: duaqua
gesture_slot_speed_4: 0.7
gesture_slot_retract_4: 2.5
gesture_slot_vx_bias_4: -0.05   
gesture_slot_trim_deg_4: 0.35
# Bù thăng bằng riêng cho slot 4 (chống trôi khi đưa tay ra trước).

# Slot 5 (A): bật/tắt voice-auto; Slot 6 (B): trái tim; Slot 7 (X): chèo tay; Slot 8 (Y): đấm tay.
gesture_slot_6: traitim
gesture_slot_speed_6: 0.6
gesture_slot_retract_6: 2.2
gesture_slot_trim_deg_6: 0.15

# Bản pose giữ tĩnh thêm 7 giây.
gesture_slot_7: cheotayngauloi_hold7s
gesture_slot_speed_7: 0.8
gesture_slot_blend_7: 0.4
gesture_slot_retract_7: 3.5
gesture_slot_trim_deg_7: 0.15

gesture_slot_8: damtaylentroi
gesture_slot_speed_8: 1.3
gesture_slot_retract_8: 2.5
gesture_slot_vx_bias_8: -0.05
gesture_slot_trim_deg_8: 0.15
# Thời gian thu tay tiêu chuẩn và thu tay khẩn cấp (safety_retract).
gesture_double_click_s: 0.4
gesture_blend_in_s: 0.4
gesture_retract_s: 2.5
gesture_safety_retract_s: 0.4

# ── Khối cấu hình riêng cho policy Unified (r1_unified_v10 / v11) ─────────────
# Ghi đè tốc độ và thời gian thu tay cho policy Unified để khớp phân phối lúc training.
unified_gesture_speed: 0.75
unified_gesture_retract_s: 3.0
unified_gesture_safety_retract_s: 3.0
gesture_guard_tilt: 0.35
gesture_guard_gyro: 3.0
# Giới hạn góc và tốc độ chuyển động đầu (nếu file .npz có head_pos).
gesture_head_yaw_max: 1.0
gesture_head_pitch_max: 0.9
gesture_head_rate_limit_rad_s: 1.5
# Hệ số feedforward thăng bằng theo độ vươn tay (dành riêng cho legacy).
gesture_balance_kg: 0.0
gesture_balance_kv: 0.0

# ============================================================================
# BÙ RIÊNG TỪNG SLOT (chỉ có tác dụng với legacy_83)
# - gesture_slot_vx_bias_N (m/s): chống trôi tiến/lùi.
# - gesture_slot_trim_deg_N (độ): bù góc nghiêng thân chúi/ngửa.
# ============================================================================
gesture_demo_wave: false

# Gesture tự động theo speech (tự thu tay khi di chuyển, phát lại khi đứng tĩnh).
gesture_voice_name: noichuyen
gesture_voice_marker: /run/hb/voice_speaking
gesture_voice_stale_s: 1.0
gesture_voice_auto_start: false
gesture_voice_speed: 1.15
gesture_voice_move_threshold: 0.05
gesture_voice_resume_threshold: 0.02
gesture_voice_resume_delay_s: 0.3

# Arm-head teleop chạy trong ZERO TORQUE; Quest trigger là deadman.
teleop_enabled: true
teleop_toggle_hold_s: 3.0
teleop_udp_port: 5560
teleop_timeout_ms: 300
teleop_blend_in_s: 0.4
teleop_retract_s: 0.5
teleop_smooth_hz: 8.0
teleop_head_yaw_max: 1.0
teleop_head_pitch_max: 0.9
teleop_arm_kp: 40.0
teleop_arm_kd: 2.0
teleop_max_rate_rad_s: 0.30

# ============================================================================
# AUDIO / VOICE — Giá trị "" = tắt; đường dẫn mp3 phát file, text thường gửi qua TTS.
# ============================================================================
voice_enabled: true
voice_volume: 0.95
voice_speaker_id: 0
voice_startup: "src/audio/start2.mp3"
# Hoãn phát voice startup để tránh chồng tiếng với built-in (0 = phát ngay).
startup_voice_delay_s: 0
voice_stand_lock: "src/audio/khoacung2.mp3"
voice_locomotion: "src/audio/batchedodichuyen2.mp3"
voice_sit_down: "src/audio/dangangngoixuong.mp3"
voice_safe_stop: "src/audio/kichhoatchedoantoan2.mp3"
voice_mimic_2: "src/audio/lamtynhac.mp3"
voice_mimic_3: "src/audio/voice_doremon.mp3"
voice_mimic_4: "src/audio/voice_pokemon.mp3"
voice_mimic_5: "src/audio/voice_doremon.mp3"

voice_fast_speed: "src/audio/tangtoc2.mp3"
voice_slow_speed: "src/audio/giamtoc2.mp3"
voice_conflict: "src/audio/xungdot.mp3"
voice_battery_low: "src/audio/pinthap.mp3"
voice_battery_critical: "src/audio/pincan.mp3"
voice_zero_torque: "src/audio/zero2.mp3"
voice_get_up: ""
voice_lie_down: ""

# Gain cho đầu (head): Hiện áp dụng cho teleop legacy; giữ nguyên cho V11 sau này.
head_yaw_kp: 20.0
head_yaw_kd: 10.0
head_pitch_kp: 10.0
head_pitch_kd: 1.0

# Bản cô lập. Thứ tự include quyết định: profile pilot treo đã được review của
# repo ghi đè cấu hình chung ở trên, rồi khoá khớp ghi đè lên nó.
include: teleop_suspended.yaml
include: teleop_lock.yaml
