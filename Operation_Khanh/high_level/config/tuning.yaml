# tuning.yaml — Tham số cấu hình HB R1 high_level.

# Card mạng DDS
network_interface: eth10

# Bộ lọc và hiệu chỉnh IMU
imu_gyro_lpf_hz: 0.0      # Lọc thông thấp gyro (Hz). 0 = tắt.
joint_vel_lpf_hz: 0.0     # Lọc thông thấp vận tốc khớp (Hz). 0 = tắt.
imu_pitch_trim_deg: 0.0   # Bù góc pitch IMU (độ)

# Gains khi không chạy policy (đứng dậy/khóa đứng)
stand_kp_leg: 200.0
stand_kp_waist: 200.0
stand_kp_arm: 40.0
stand_kd: 3.0

# Scale gains của policy
policy_kp_scale: 1.0
policy_kd_scale: 1.0

# Giới hạn tốc độ
slow_vx: 1.0
slow_vy: 0.7
slow_yaw: 1.5
slow_vx_back: 0.7
fast_vx: 2.0
fast_vy: 0.7
fast_yaw: 2.0
fast_vx_back: 0.8

# Giới hạn gia tốc lệnh
cmd_accel_vx: 2.5
cmd_accel_vy: 2.0
cmd_accel_yaw: 3.0

# Cấu hình chuyển trạng thái
stand_up_time_s: 2.5      # Thời gian đứng dậy (s)
blend_time_s: 0.5         # Thời gian blend tư thế (s)
stand_rate_limit: 5.0     # Giới hạn tốc độ khớp khi đứng dậy (rad/s)
lock_rate_limit: 0.2      # Giới hạn tốc độ khớp khi khóa đứng (rad/s)
return_rate_limit: 1.5    # Giới hạn tốc độ khớp khi về tư thế mặc định (rad/s)
stand_lock_spread: 0.08   # Độ rộng dạng hông khi khóa đứng (rad)
return_pos_tol: 0.12      # Sai số chấp nhận đã về default (rad)

# Điều kiện dừng trước khi khóa đứng/ngồi
settle_time_s: 1.0        # Thời gian tối thiểu đứng yên (s)
settle_gyro_max: 0.5      # Giới hạn gyro tối đa (rad/s)

# Giới hạn tốc độ khớp khi chạy policy (rad/s)
policy_rate_limit: 40.0

# Phát hiện ngã (Fall detector)
fall_enabled: true
fall_tilt_deg: 50.0       # Góc nghiêng tối đa (độ)
fall_flip_tilt_deg: 30.0  # Góc nghiêng kích hoạt lật (độ)
fall_flip_gyro: 6.0       # Gyro kích hoạt lật (rad/s)
fall_debounce_ms: 30.0    # Thời gian lọc nhiễu ngã (ms)

# Watchdogs
state_timeout_ms: 1000.0   # Mất lowstate -> damping (ms)
remote_timeout_ms: 1500.0  # Mất gamepad timeout (ms)
x11_release_ms: 2500.0     # Mất tín hiệu X11 timeout (ms)

# Mô hình policy đi bộ
flat_model: policy_11_07.onnx

# Điệu nhảy (Multi-Dance)
# Phím 2 (R1 + Lên)
dance_2: lacmong1
dance_speed_2: 1.0
dance_volume_2: 0.7

# Phím 3 (R1 + Phải)
dance_3: lacmong2
dance_speed_3: 1.0
dance_volume_3: 0.7

# Phím 4 (R1 + Xuống)
dance_4: pokemon
dance_speed_4: 1.0
dance_volume_4: 0.7

# Phím 5
dance_5: doremon
dance_speed_5: 1.0
dance_volume_5: 0.7

# Tham số dùng chung cho các điệu nhảy
dance_start_frame: -1            # -1 để tự động tìm frame bắt đầu mượt nhất
dance_start_search_frames: 200   # Phạm vi quét frame (số frame đầu clip)
mimic_announce_delay_s: 2.0      # Thời gian chờ trước khi bắt đầu nhảy (s)

# Chế độ nhà phát triển (Dev mode)
dev_no_keyboard: false           # Bật true để tắt bàn phím X11 (chỉ dùng gamepad)

# Dừng an toàn (Safe stop) khi mất kết nối đầu vào
safe_stop_enabled: true
safe_stop_debounce_ms: 300.0   # Độ trễ trước khi kích hoạt dừng an toàn (ms)

# Cấu hình ngồi ghế
sit_knee_deg: 90.0               # Góc gối khi ngồi (độ)
sit_descent_time_s: 4.0          # Thời gian hạ người xuống (s)
sit_hold_s: 0.5                  # Thời gian giữ tư thế ngồi (s)
sit_release_after: false         # Xả lực sau khi ngồi xong hay không
sit_kp_leg: 200.0                # Độ cứng khớp chân khi ngồi
sit_kd: 3.0                      # Độ giảm chấn khớp khi ngồi
sit_rate_limit: 3.0              # Giới hạn tốc độ khớp khi ngồi (rad/s)
sit_gather_time_s: 1.5           # Thời gian khép chân chuẩn bị ngồi (s)
sit_stance: 0.0                  # Góc khép khớp hông (rad)
sit_lateral_flat: true           # Giữ lòng bàn chân phẳng khi khép chân

# Cấu hình âm thanh giọng nói (tiếng Việt)
voice_enabled: true
voice_volume: 0.9
voice_speaker_id: 0
voice_startup: "/home/unitree/HB/high_level_2/src/audio/start.mp3"
voice_stand_lock: "/home/unitree/HB/high_level_2/src/audio/khoacung.mp3"
voice_locomotion: "/home/unitree/HB/high_level_2/src/audio/batchedodichuyen.mp3"
voice_sit_down: "/home/unitree/HB/high_level_2/src/audio/dangangngoixuong.mp3"
voice_safe_stop: "/home/unitree/HB/high_level_2/src/audio/kichhoatchedoantoan.mp3"
voice_mimic_2: "/home/unitree/HB/high_level_2/src/audio/lamtynhac.mp3"
voice_mimic_3: "/home/unitree/HB/high_level_2/src/audio/lamtynhac2.mp3"
voice_mimic_4: "/home/unitree/HB/high_level_2/src/audio/voice_pokemon.mp3"
voice_mimic_5: "/home/unitree/HB/high_level_2/src/audio/voice_doraemon.mp3"

# Điều khiển khớp đầu (giữ 0 rad)
head_yaw_kp: 20.0
head_yaw_kd: 10.0
head_pitch_kp: 10.0
head_pitch_kd: 1.0
