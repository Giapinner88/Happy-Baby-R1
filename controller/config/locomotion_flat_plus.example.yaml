# ============================================================================
# MẪU OPT-IN cho policy history `flat_plus_h4_v1`. KHÔNG phải config đang chạy.
#
# Cách dùng: chỉ sau khi model đã qua Gate 7 (closed-loop simulator) và
# preflight, chép hai dòng CHỌN POLICY dưới đây đè lên `config/locomotion.yaml`.
# Rollback = khôi phục lại legacy_83 / policy_goc_2.onnx, không đổi symlink,
# không ghi đè file model (mất hash/provenance).
# ============================================================================

# Bằng period của phase obs lúc train — H4 không đổi điều này.
gait_period_s: 0.6

flat_policy_contract: flat_plus_h4_v1
flat_model: policy_flat_plus_h4_v1.onnx

