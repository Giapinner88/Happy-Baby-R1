# OPT-IN only: H4 history + current STAND/WALK/W2S one-hot, 335-D input.
# Keep config/locomotion.yaml unchanged for legacy rollback.
gait_period_s: 0.6
flat_policy_contract: flat_plus_gait_h4_v1
