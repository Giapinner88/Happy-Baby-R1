# start_frame=-1: tự tìm frame mở đầu mượt. Handover diễn ra khi robot đủ tĩnh hoặc hết max_s.
dance_start_frame: -1
dance_start_search_frames: 200
mimic_announce_delay_s: 2.0
mimic_announce_min_s: 0.3
mimic_announce_timeout_s: 20.0
# Do not leave locomotion while the body/joints are still moving. If the gate
# is not met, the robot remains in locomotion with zero command.
mimic_entry_settle_s: 0.4
mimic_entry_gyro_max: 0.5
mimic_entry_dq_max: 0.6
mimic_warmup_s: 1.5
mimic_cooldown_s: 1.8
mimic_home_exit_blend_s: 0.25
mimic_handover_tilt: 0.15
mimic_handover_gyro: 0.5
mimic_handover_min_s: 0.3
mimic_handover_max_s: 3.0
# Keep the established legacy handover active for the current hardware route.
# Transition v2 is opt-in and remains available for isolated validation only;
# the current dance assets showed target transients with v2 enabled.
mimic_transition_v2: false
mimic_transition_search_frames: 200
mimic_transition_clip_ramp_s: 0.35
mimic_transition_exit_pos_tol: 0.12
mimic_transition_exit_dq_tol: 0.60
mimic_transition_fallback_pos_tol: 0.25
mimic_transition_fallback_dq_tol: 1.50
mimic_telemetry_enabled: true
mimic_telemetry_hz: 100
mimic_telemetry_post_s: 5.0
mimic_telemetry_dir: logs/telemetry
