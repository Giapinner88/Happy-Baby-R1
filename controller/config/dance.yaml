# Automatic guard for every dance; no per-policy tilt on/off.
# Locomotion/entry: upright tilt. MIMIC (warmup/clip/cooldown): torso vs reference.
# Quiet upright tail/cooldown also gets fast upright protection automatically (fall_*).
# A sustained deviation returns to IDLE/damping (L2+B); resume by a new safe command.
state_motion_guard: true
dance_tracking_error_deg: 45.0
dance_tracking_debounce_s: 0.10
motion_safety_state_timeout_s: 0.10

# dance_home_exit_N: skip redundant cooldown only after a quiet terminal HOME hold.
# Default off; re-test when changing the ONNX/NPZ package.
dance_1: xexe_goc_cut_20261021
dance_home_exit_1: on
dance_speed_1: 1.0
dance_volume_1: 0.7
dance_trim_deg_1: 0.0

dance_2: doremon_goc_4096env_end75_home_20261021
dance_home_exit_2: on
dance_speed_2: 1.0
dance_volume_2: 0.7
dance_trim_deg_2: 0.0

dance_3: pokemonplus_goc_no_spin_no_lean_12288env_friction08to15_ckpt14500_20261027
dance_home_exit_3: on
dance_speed_3: 1.0
dance_volume_3: 0.7
dance_trim_deg_3: 0.0

