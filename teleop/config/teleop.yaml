schema_version: 2

# Robot-local Quest teleop (hb_teleop_runtime): Quest -> WebXR -> vendor R1-A5 IK
# -> sidecar -> UDP 127.0.0.1:5560 -> run_r1. run_r1 stays the only rt/lowcmd writer.
# After editing: `make teleop-runtime` on the robot (rewrites /etc/hb/teleop/runtime.env).
robot_runtime:
  enabled: true
  # DDS interface inside the robot (rt/lowstate).
  robot_interface: eth10
  # Wi-Fi interface the Quest reaches; its IPv4 goes into the Quest URL.
  host_interface: wlan0
  hostname: hb-r1.local
  port: 8012
  ik_backend: vendor_r1_a5
  # `vendor`: unmodified upstream IK, hand pose only, elbow placed by the solver.
  # `swivel`: also tracks an elbow target estimated from controller orientation
  # (vendor weights + elbow term). Not yet validated on hardware.
  elbow_mode: vendor
  cert_file: /etc/hb/teleop/cert.pem
  key_file: /etc/hb/teleop/key.pem
  joint_limits_only: true
  bridge_hz: 30
  # Publish fresh solutions at up to 30 Hz; an old solution is never replayed to
  # extend the deadman.
  control_hz: 30
  send_hz: 100
  # 0 = run indefinitely; START only toggles teleop authority inside run_r1.
  duration_s: 0
  # 0 = wait for the Quest indefinitely; the sidecar sends only STOP until a valid target arrives.
  first_input_timeout_s: 0
  # 0 = wait for rt/lowstate indefinitely after start. No UDP is sent before the
  # controller actually receives LowState, so a slow DDS/R3 start does not kill the sidecar.
  initial_state_timeout_s: 0
  # ARM64 vendor IK occasionally needs >300 ms for one solve.
  source_timeout_s: 0.60
  # 0 = keep the robot-local pipeline alive after the trigger is released; squeeze again any time.
  release_debounce_s: 0
  # Increase only in deliberate suspended-robot steps: 0.15 -> 0.35 -> 0.60.
  max_offset_rad: 0.15
  head_yaw_max_rad: 0.65
  head_pitch_max_rad: 0.70
  # `auto` pins bridge, mapper+sidecar and vendor IK apart when the robot has at
  # least 4 online CPUs. `off` only for diagnosis or an unusual CPU topology.
  cpu_affinity: auto
  # R1 camera served from the robot itself (no laptop or SSH tunnel). The right-hand
  # A button on the Quest toggles passthrough / camera. In passthrough no frame is
  # fetched or decoded; pressing A waits for a fresh frame before showing it.
  camera_enabled: true
  camera_interface: eth10
  # 0 = adaptive FPS from measured source/CPU capacity + WebRTC bandwidth feedback.
  # A positive value is an explicit operator cap.
  camera_capture_hz: 0
  camera_media_port: 8013
  camera_width: 640
  camera_height: 360
  camera_startup_timeout_s: 5.0
  camera_enable_max_age_s: 0.50
  camera_fallback_max_age_s: 1.00
